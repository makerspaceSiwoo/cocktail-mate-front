# localias 로컬 개발용 HTTPS 도메인 매핑 (git repo root 에서 자동 인식됨).
# 목적: 로컬 개발에서도 HTTPS 도메인으로 띄워 Secure / SameSite=None 쿠키를 테스트.
#
# 설치 : brew install peterldowns/tap/localias
# 신뢰 : localias debug cert --install   (로컬 CA 를 시스템/브라우저 신뢰 저장소에 등록, 1회)
# 기동 : localias start    (상태: localias status / 설정변경 반영: localias reload / 종료: localias stop)
#        → /etc/hosts 수정 때문에 sudo 가 필요할 수 있다.
#
# 도메인 메모:
#   - .cocktail-mate 는 실제 존재하지 않는 TLD → /etc/hosts 로만 로컬 resolve, 외부로 안 나감(안전).
#   - 점(.)이 있어 브라우저가 검색어가 아닌 호스트로 확실히 인식한다.
#   - localias 는 한 도메인을 한 포트에만 매핑(경로 분기 미지원) → 서브도메인으로 분리.

local.cocktail-mate: 3000 # 프론트 (next dev) → https://local.cocktail-mate
api.cocktail-mate: 8000 # 로컬 백엔드 (docker compose 의 api:8000) → https://api.cocktail-mate
