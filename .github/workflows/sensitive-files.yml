# =============================================================================
# Sensitive Files — 민감 파일 변경 감지 & 리뷰 강제
# =============================================================================
# 아래 파일이 변경된 PR에 자동으로:
#   1. "needs-review" 라벨을 부착한다
#   2. 레포 owner(makerspaceSiwoo)를 리뷰어로 지정한다
#   3. PR에 어떤 민감 파일이 변경되었는지 코멘트를 남긴다
#
# 감시 대상 파일:
#   - .gitignore          — 무시 패턴 변경 시 민감 파일 노출 위험
#   - .env*               — 환경변수 파일이 실수로 추가될 수 있음
#   - package.json        — 의존성 변경은 팀 승인 필요
#   - pnpm-lock.yaml      — lockfile 변경은 의존성 변경을 의미
#   - next.config.ts      — 빌드/런타임 설정 변경
#   - middleware.ts        — 인증 가드 로직 변경
#   - .github/workflows/* — CI/CD 파이프라인 변경
# =============================================================================

name: Sensitive Files Check

on:
  pull_request:
    branches: [main]
    paths:
      # 아래 파일 중 하나라도 변경되면 이 워크플로우가 트리거된다
      - ".gitignore"
      - ".env*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "src/middleware.ts"
      - ".github/workflows/**"

jobs:
  flag-sensitive-changes:
    name: Flag sensitive file changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # GitHub Actions 봇이 PR에 라벨/코멘트/리뷰어를 추가하기 위한 권한
    permissions:
      pull-requests: write
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # 1. 코드 체크아웃 (변경 파일 목록 조회용)
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 전체 히스토리를 가져와야 base..head diff를 정확히 계산할 수 있음

      # -----------------------------------------------------------------------
      # 2. 변경된 민감 파일 목록 추출
      #    - base 브랜치(main)와 비교하여 변경된 파일 중 민감 파일만 필터링
      #    - 결과를 GITHUB_OUTPUT에 저장하여 이후 스텝에서 사용
      # -----------------------------------------------------------------------
      - name: Detect changed sensitive files
        id: detect
        run: |
          # main 브랜치와 비교하여 변경된 파일 목록
          CHANGED=$(git diff --name-only origin/main...HEAD)

          # 민감 파일 패턴 매칭
          SENSITIVE=""
          while IFS= read -r file; do
            case "$file" in
              .gitignore|.env*|package.json|pnpm-lock.yaml|next.config.ts|src/middleware.ts)
                SENSITIVE="$SENSITIVE- \`$file\`\n"
                ;;
              .github/workflows/*)
                SENSITIVE="$SENSITIVE- \`$file\`\n"
                ;;
            esac
          done <<< "$CHANGED"

          if [ -n "$SENSITIVE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            # 멀티라인 출력을 GITHUB_OUTPUT에 저장
            {
              echo "files<<EOF"
              echo -e "$SENSITIVE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 3. "needs-review" 라벨 부착
      #    - 라벨이 없으면 자동 생성됨 (노란색)
      #    - 민감 파일이 변경된 경우에만 실행
      # -----------------------------------------------------------------------
      - name: Add "needs-review" label
        if: steps.detect.outputs.found == 'true'
        run: |
          # 라벨이 없으면 생성
          gh label create "needs-review" \
            --description "민감 파일 변경 — owner 리뷰 필요" \
            --color "FBCA04" \
            --force

          # PR에 라벨 부착
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label "needs-review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 4. 레포 owner를 리뷰어로 지정
      #    - PR 작성자가 owner 본인이면 리뷰어 지정을 건너뜀
      #    - makerspaceSiwoo를 다른 owner로 변경하려면 아래 값을 수정
      # -----------------------------------------------------------------------
      - name: Request review from repo owner
        if: steps.detect.outputs.found == 'true'
        run: |
          OWNER="makerspaceSiwoo"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          # PR 작성자가 owner 본인이면 리뷰어 지정 불필요
          if [ "$PR_AUTHOR" != "$OWNER" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" \
              --add-reviewer "$OWNER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 5. PR에 경고 코멘트 작성
      #    - 어떤 민감 파일이 변경되었는지 명시
      #    - 리뷰어가 무엇을 확인해야 하는지 안내
      # -----------------------------------------------------------------------
      - name: Comment on PR
        if: steps.detect.outputs.found == 'true'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$(cat <<'COMMENT'
          ## :warning: 민감 파일 변경 감지

          이 PR에서 다음 민감 파일이 변경되었습니다:

          ${{ steps.detect.outputs.files }}

          **리뷰어 확인 사항:**
          - [ ] `.gitignore` 변경: 민감 파일이 노출되지 않는지 확인
          - [ ] `package.json` / `pnpm-lock.yaml` 변경: 새 의존성이 승인되었는지 확인
          - [ ] `next.config.ts` 변경: 빌드/보안 설정에 문제가 없는지 확인
          - [ ] `middleware.ts` 변경: 인증 가드 로직이 올바른지 확인
          - [ ] CI/CD 변경: 파이프라인이 의도대로 동작하는지 확인
          COMMENT
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
