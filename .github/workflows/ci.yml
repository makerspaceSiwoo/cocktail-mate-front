# =============================================================================
# CI — Pull Request 품질 게이트
# =============================================================================
# PR이 열리거나 업데이트될 때 자동으로 실행된다.
# 모든 체크가 통과해야 merge 가능하도록 Branch Protection Rule과 함께 사용한다.
#
# 실행 항목:
#   1. pnpm typecheck  — TypeScript 타입 검사
#   2. pnpm lint        — ESLint 코드 품질 검사
#   3. pnpm build       — Next.js 프로덕션 빌드 (빌드 에러 사전 차단)
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
    # main으로 향하는 PR에서만 실행

concurrency:
  # 같은 PR에서 여러 커밋이 push되면 이전 실행을 취소하고 최신만 실행
  group: ci-${{ github.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. 코드 체크아웃
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. pnpm 설치
      # -----------------------------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # packageManager 필드에서 버전을 자동으로 읽어옴

      # -----------------------------------------------------------------------
      # 3. Node.js 설정 + pnpm 캐시 활성화
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # -----------------------------------------------------------------------
      # 4. 의존성 설치 (lockfile 기준, 변경 불허)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # 5. TypeScript 타입 검사
      #    - tsc --noEmit 으로 타입 에러만 체크
      # -----------------------------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      # -----------------------------------------------------------------------
      # 6. ESLint 코드 품질 검사
      #    - eslint.config.mjs 기준
      # -----------------------------------------------------------------------
      - name: Lint
        run: pnpm lint

      # -----------------------------------------------------------------------
      # 7. Next.js 프로덕션 빌드
      #    - 빌드 실패 = merge 불가
      #    - 런타임 에러는 잡지 못하지만, 컴파일 에러와 빌드 최적화 문제를 사전 차단
      # -----------------------------------------------------------------------
      #    - NEXT_PUBLIC_API_URL 은 빌드 타임에 번들로 인라인되므로 여기서 주입한다.
      #      (홈/탐색 페이지는 빌드 중 서버에서 이 주소로 데이터를 프리렌더한다)
      #      GitHub → Settings → Secrets and variables → Actions 에 등록 필요.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
